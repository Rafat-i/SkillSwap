<div class="job-details-page" *ngIf="job">
  <div style="padding: 2rem;">
    <h1>{{ job.title }}</h1>
    <p><strong>Status:</strong> {{ job.status }}</p>
    <p><strong>Category:</strong> {{ job.category }}</p>
    <p><strong>Budget:</strong> ${{ job.budget }}</p>
    <p style="margin-top: 1rem;">{{ job.description }}</p>
  </div>

  <div class="auth-container" *ngIf="job.status === 'open'">
    <div class="auth-card">
      <h2>Submit a Proposal</h2>
      
      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
      
      <div *ngIf="successMessage" style="color: #27ae60; font-weight: bold; margin-bottom: 1rem; text-align: center;">
        {{ successMessage }}
      </div>

      <form (ngSubmit)="submitProposal()">
        <div class="form-group">
          <label for="price">Proposed Price ($)</label>
          <input type="number" id="price" name="price" [(ngModel)]="price" required>
        </div>

        <div class="form-group">
          <label for="coverLetter">Cover Letter</label>
          <textarea id="coverLetter" name="coverLetter" [(ngModel)]="coverLetter" required></textarea>
        </div>

        <button type="submit">Submit Proposal</button>
      </form>
    </div>
  </div>
</div>
