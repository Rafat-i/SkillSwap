<div class="profile-page">
  <h1>My Profile</h1>

  <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="profile-card" *ngIf="user">
    <h2>{{ user.name }}</h2>
    <p class="username">@{{ user.username }}</p>
    <p class="email" *ngIf="user.email">{{ user.email }}</p>
    <p class="bio" *ngIf="user.bio">{{ user.bio }}</p>

    <div class="stats">
      <div class="stat">
        <span class="stat-value">{{ user.rating_avg ?? 0 }}</span>
        <span class="stat-label">Rating</span>
      </div>
      <div class="stat">
        <span class="stat-value">{{ user.completed_jobs ?? 0 }}</span>
        <span class="stat-label">Completed Jobs</span>
      </div>
    </div>

    <div class="skills" *ngIf="user.skills && user.skills.length > 0">
      <h3>Skills</h3>
      <div class="skill-tags">
        <span class="skill-tag" *ngFor="let skill of user.skills">{{ skill }}</span>
      </div>
    </div>
  </div>
</div>
