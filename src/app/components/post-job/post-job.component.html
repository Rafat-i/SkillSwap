<div class="auth-container">
  <div class="auth-card">
    <h2>Post a new job</h2>
    <p class="subtitle">Fill out the details below to find the perfect freelancer.</p>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group form-field">
        <label class="form-label" for="title">Job title</label>
        <input
          class="form-control"
          type="text"
          id="title"
          name="title"
          [(ngModel)]="title"
          placeholder="e.g., Build an E-commerce Website"
          required
        />
      </div>

      <div class="form-group form-field">
        <label class="form-label" for="category">Category</label>
        <input
          class="form-control"
          type="text"
          id="category"
          name="category"
          [(ngModel)]="category"
          placeholder="e.g., Web Development"
          required
        />
      </div>

      <div class="form-group form-field">
        <label class="form-label" for="budget">Budget ($)</label>
        <input
          class="form-control"
          type="number"
          id="budget"
          name="budget"
          [(ngModel)]="budget"
          placeholder="500"
          required
        />
      </div>

      <div class="form-group form-field">
        <label class="form-label" for="description">Job description</label>
        <textarea
          class="form-control"
          id="description"
          name="description"
          [(ngModel)]="description"
          placeholder="Describe the project requirements, deliverables, and timeline..."
          required
        ></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Post job</button>
    </form>
  </div>
</div>
