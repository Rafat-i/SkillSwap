<div class="jobs-page">
  <h1>My Postings</h1>

  <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="jobs-list">
    <div class="job-card" *ngFor="let job of jobs" [routerLink]="['/jobs', job.id]" style="cursor: pointer;">
      <h2>{{ job.title }}</h2>
      <p class="category"><strong>Category:</strong> {{ job.category }}</p>
      <p class="budget"><strong>Budget:</strong> ${{ job.budget }}</p>
      <p class="description">{{ job.description }}</p>
      <span class="status badge">Status: {{ job.status }}</span>
    </div>
  </div>

  <p *ngIf="!errorMessage && jobs.length === 0" class="empty">You have not posted any jobs yet.</p>
</div>
