<div class="jobs-page">
  <h1>Browse Jobs</h1>

  <div class="filters-container">
    <form (ngSubmit)="applyFilters()">
      
      <div class="filter-group">
        <label for="category">Category</label>
        <input type="text" id="category" name="category" [(ngModel)]="filters.category" placeholder="e.g. Web Development">
      </div>

      <div class="filter-group budget-group">
        <label for="minBudget">Min Budget ($)</label>
        <input type="number" id="minBudget" name="minBudget" [(ngModel)]="filters.min_budget" placeholder="0">
      </div>

      <div class="filter-group">
        <label for="status">Status</label>
        <select id="status" name="status" [(ngModel)]="filters.status">
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <div class="filter-action">
        <button type="submit" class="btn-search">Search</button>
      </div>
      
    </form>
    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
  </div>

  <div class="jobs-list">
    <div class="job-card" *ngFor="let job of jobs" [routerLink]="['/jobs', job.id]">
      
      <div class="job-card-header">
        <h2>{{ job.title }}</h2>
        <span class="status-badge" [ngClass]="'status-' + job.status">{{ job.status }}</span>
      </div>

      <div class="job-meta">
        <p class="category"><strong>Category:</strong> {{ job.category }}</p>
        <p class="budget"><strong>Budget:</strong> ${{ job.budget }}</p>
      </div>
      
      <p class="description">{{ job.description }}</p>
    </div>
  </div>

  <div class="empty-state" *ngIf="jobs.length === 0 && !errorMessage">
    <p>No jobs found matching your criteria.</p>
  </div>
</div>
