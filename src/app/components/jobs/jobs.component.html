<div class="jobs-page">
  <h1>Browse Jobs</h1>

  <div class="filters-container" style="background: #f9f9f9; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
    <form (ngSubmit)="applyFilters()" style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
      
      <div class="filter-group" style="flex: 1; min-width: 200px;">
        <label for="category" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Category</label>
        <input type="text" id="category" name="category" [(ngModel)]="filters.category" placeholder="e.g. Web Development" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
      </div>

      <div class="filter-group" style="flex: 1; min-width: 150px;">
        <label for="minBudget" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Min Budget ($)</label>
        <input type="number" id="minBudget" name="minBudget" [(ngModel)]="filters.min_budget" placeholder="0" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
      </div>

      <div class="filter-group" style="flex: 1; min-width: 150px;">
        <label for="status" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Status</label>
        <select id="status" name="status" [(ngModel)]="filters.status" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <button type="submit" style="padding: 0.6rem 1.5rem; background: #2c3e50; color: #fff; border: none; border-radius: 4px; cursor: pointer; height: 40px;">Search</button>
    </form>
    <div class="error-message" *ngIf="errorMessage" style="color: #e74c3c; margin-top: 1rem;">{{ errorMessage }}</div>
  </div>

  <div class="jobs-list">
    <div class="job-card" *ngFor="let job of jobs" [routerLink]="['/jobs', job.id]" style="cursor: pointer;">
      <h2>{{ job.title }}</h2>
      <p class="category"><strong>Category:</strong> {{ job.category }}</p>
      <p class="budget"><strong>Budget:</strong> ${{ job.budget }}</p>
      <p class="description">{{ job.description }}</p>
      <span class="status badge">Status: {{ job.status }}</span>
    </div>
  </div>

  <p *ngIf="jobs.length === 0 && !errorMessage" style="text-align: center; color: #7f8c8d; margin-top: 2rem;">No jobs found matching your criteria.</p>
</div>
