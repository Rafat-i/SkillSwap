<main class="jobs-page">
  <header class="page-header">
    <div>
      <h1>Find your next project</h1>
      <p class="page-subtitle">
        Browse open work from clients looking for skilled freelancers.
      </p>
    </div>
  </header>

  <section class="filters-container">
    <form (ngSubmit)="applyFilters()">
      <div class="filter-group">
        <label for="category">Category</label>
        <input
          id="category"
          name="category"
          class="form-control"
          type="text"
          [(ngModel)]="filters.category"
          placeholder="e.g. Web Development, Design"
        />
      </div>

      <div class="filter-group budget-group">
        <label for="minBudget">Min Budget ($)</label>
        <input
          id="minBudget"
          name="minBudget"
          class="form-control"
          type="number"
          [(ngModel)]="filters.min_budget"
          placeholder="0"
        />
      </div>

      <div class="filter-group">
        <label for="status">Status</label>
        <select
          id="status"
          name="status"
          class="form-control"
          [(ngModel)]="filters.status"
        >
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <div class="filter-action">
        <button type="submit" class="btn btn-primary">Search jobs</button>
      </div>
    </form>

    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
  </section>

  <section class="jobs-list">
    <article
      class="job-card"
      *ngFor="let job of jobs"
      [routerLink]="['/jobs', job.id]"
    >
      <div class="job-card-header">
        <div>
          <h2>{{ job.title }}</h2>
          <div class="meta-row">
            <span class="badge badge-status" [ngClass]="'status-' + job.status">
              {{ job.status }}
            </span>
            <span class="badge badge-category">{{ job.category }}</span>
          </div>
        </div>
        <div class="price-chip">
          <span class="price-label">Budget</span>
          <span class="price-value">${{ job.budget }}</span>
        </div>
      </div>

      <p class="description">
        {{ job.description }}
      </p>
    </article>
  </section>

  <div class="empty-state" *ngIf="jobs.length === 0 && !errorMessage">
    <p>No jobs found matching your criteria.</p>
  </div>
</main>
